<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Para alguien especial 🌻</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Georgia, "Times New Roman", serif;
}

body {
    position: relative;
    background:
        radial-gradient(
            circle at center,
            #080600 0%,
            #020200 55%,
            #000 100%
        );
}


/* =====================================================
   RAMO
===================================================== */

.ramo {

    position: absolute;

    width: 520px;
    height: 650px;

    left: 50%;
    top: 48%;

    transform:
        translate(-50%, -50%)
        scale(.62);

    transform-origin: center;

}


/* =====================================================
   SVG — TALLOS Y HOJAS
===================================================== */

.tallos-svg {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    overflow: visible;

}


/* =====================================================
   TALLOS
===================================================== */

.tallo {

    fill: none;

    stroke: #3c7f35;

    stroke-width: 8;

    stroke-linecap: round;
    stroke-linejoin: round;

    stroke-dasharray: 900;
    stroke-dashoffset: 900;

    animation:
        dibujarTallo 2.7s
        cubic-bezier(.45,0,.25,1)
        forwards;

}


/*
   Pequeño brillo sobre algunos tallos
*/

.tallo-brillo {

    fill: none;

    stroke: rgba(105,170,70,.35);

    stroke-width: 2.5;

    stroke-linecap: round;

    stroke-dasharray: 900;
    stroke-dashoffset: 900;

    animation:
        dibujarTallo 2.7s
        cubic-bezier(.45,0,.25,1)
        forwards;

}


@keyframes dibujarTallo {

    to {
        stroke-dashoffset: 0;
    }

}


/* =====================================================
   HOJAS
===================================================== */

.hoja-grupo {

    opacity: 0;

    transform-box: fill-box;
    transform-origin: 0 50%;

    animation:
        brotarHoja .8s ease forwards,
        balancearHoja 4s ease-in-out infinite;

    animation-delay:
        var(--delay),
        calc(var(--delay) + .8s);

}


.hoja-forma {

    fill: #4f963d;

    stroke: #2e6528;

    stroke-width: 2;

    filter:
        drop-shadow(
            0 2px 2px rgba(0,0,0,.35)
        );

}


@keyframes brotarHoja {

    0% {

        opacity: 0;

        transform:
            scale(0)
            rotate(-15deg);

    }

    70% {

        opacity: 1;

        transform:
            scale(1.12)
            rotate(4deg);

    }

    100% {

        opacity: 1;

        transform:
            scale(1)
            rotate(0deg);

    }

}


@keyframes balancearHoja {

    0%,
    100% {

        transform:
            rotate(-2deg);

    }

    50% {

        transform:
            rotate(3deg);

    }

}


/* =====================================================
   GIRASOLES
===================================================== */

.girasol {

    position: absolute;

    width: 150px;
    height: 150px;

    left: var(--x);
    top: var(--y);

    opacity: 0;

    transform:
        translate(-50%, -50%)
        scale(0);

    animation:

        aparecerFlor 1s
        cubic-bezier(.2,.8,.2,1)
        forwards,

        vientoFlor 5s
        ease-in-out infinite;

    animation-delay:

        var(--delay),

        calc(var(--delay) + 4.5s);

}


@keyframes aparecerFlor {

    0% {

        opacity: 0;

        transform:
            translate(-50%, -50%)
            scale(0)
            rotate(-18deg);

    }

    70% {

        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1.12)
            rotate(5deg);

    }

    100% {

        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1)
            rotate(0deg);

    }

}


/*
   Movimiento muy suave.
   La idea es que parezca una brisa,
   no que las flores estén bailando.
*/

@keyframes vientoFlor {

    0% {

        margin-left: 0;
        margin-top: 0;

    }

    25% {

        margin-left: 2px;
        margin-top: -1px;

    }

    50% {

        margin-left: 0;
        margin-top: 1px;

    }

    75% {

        margin-left: -2px;
        margin-top: 0;

    }

    100% {

        margin-left: 0;
        margin-top: 0;

    }

}


/* =====================================================
   PÉTALOS
===================================================== */

.petalo {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 42px;
    height: 88px;

    border-radius:
        50% 50% 45% 45%;

    transform-origin:
        50% 100%;

    background:

        linear-gradient(
            to bottom,
            #ffe86a,
            #f5c51d 65%,
            #d99800
        );

    box-shadow:
        0 0 8px
        rgba(255,204,30,.35);

}


.petalo.interior {

    width: 34px;
    height: 74px;

    background:

        linear-gradient(
            to bottom,
            #ffdc51,
            #edb716 65%,
            #c88900
        );

}


/* =====================================================
   CENTRO
===================================================== */

.centro {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 66px;
    height: 66px;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background:

        radial-gradient(
            circle at 35% 30%,
            #825017,
            #402509 60%,
            #1d1004
        );

    box-shadow:

        inset 0 0 12px
        rgba(0,0,0,.7),

        0 0 12px
        rgba(255,190,20,.15);

}


/* =====================================================
   PARTÍCULAS DORADAS
===================================================== */

.particula {

    position: absolute;

    width: 4px;
    height: 4px;

    border-radius: 50%;

    background: #ffd83d;

    box-shadow:

        0 0 6px #ffd83d,

        0 0 13px
        rgba(255,216,61,.75);

    opacity: 0;

    animation:
        caerParticula
        var(--duration)
        linear
        infinite;

    animation-delay:
        var(--delay);

}


@keyframes caerParticula {

    0% {

        transform:
            translate3d(
                0,
                -30px,
                0
            )
            scale(.3);

        opacity: 0;

    }

    12% {

        opacity: .9;

    }

    50% {

        transform:
            translate3d(
                15px,
                50vh,
                0
            )
            scale(.9);

    }

    85% {

        opacity: .7;

    }

    100% {

        transform:
            translate3d(
                -10px,
                110vh,
                0
            )
            scale(1);

        opacity: 0;

    }

}


/* =====================================================
   TEXTO
===================================================== */

.mensaje {

    position: absolute;

    left: 50%;
    bottom: 7%;

    width: 90%;

    transform:
        translateX(-50%)
        translateY(15px);

    text-align: center;

    color: #ffe36a;

    opacity: 0;

    animation:
        aparecerMensaje
        2.2s
        cubic-bezier(.2,.8,.2,1)
        forwards;

    animation-delay: 12s;

    text-shadow:

        0 0 10px
        rgba(255,214,70,.5),

        0 0 25px
        rgba(255,190,20,.3);

}


.mensaje h1 {

    margin: 0 0 10px;

    font-size: 30px;

    font-weight: normal;

    letter-spacing: .5px;

}


.mensaje p {

    margin: 0;

    font-size: 19px;

}


@keyframes aparecerMensaje {

    from {

        opacity: 0;

        transform:
            translateX(-50%)
            translateY(20px)
            scale(.96);

    }

    to {

        opacity: 1;

        transform:
            translateX(-50%)
            translateY(0)
            scale(1);

    }

}


/* =====================================================
   DESTELLO DETRÁS DEL MENSAJE
===================================================== */

.mensaje::before {

    content: "";

    position: absolute;

    z-index: -1;

    left: 50%;
    top: 50%;

    width: 300px;
    height: 120px;

    transform:
        translate(-50%, -50%);

    background:
        radial-gradient(
            ellipse,
            rgba(255,205,50,.12),
            transparent 70%
        );

    filter: blur(10px);

}


/* =====================================================
   MÓVIL
===================================================== */

@media (max-width: 600px) {

    .ramo {

        top: 46%;

        transform:
            translate(-50%, -50%)
            scale(.47);

    }

    .mensaje {

        bottom: 6%;

    }

    .mensaje h1 {

        font-size: 25px;

    }

    .mensaje p {

        font-size: 16px;

    }

}


/* =====================================================
   CELULARES MUY PEQUEÑOS
===================================================== */

@media (max-width: 380px) {

    .ramo {

        transform:
            translate(-50%, -50%)
            scale(.41);

    }

    .mensaje h1 {

        font-size: 22px;

    }

    .mensaje p {

        font-size: 15px;

    }

}

</style>
</head>

<script>


/* =====================================================
   CREAR GIRASOLES
===================================================== */

const flores =
    document.querySelectorAll(".girasol");


flores.forEach(flor => {


    /* PÉTALOS EXTERIORES */

    for(let i = 0; i < 20; i++) {

        const petalo =
            document.createElement("div");

        petalo.className =
            "petalo";

        petalo.style.transform =
            `translate(-50%, -100%)
             rotate(${i * 18}deg)`;

        flor.appendChild(petalo);

    }


    /* PÉTALOS INTERIORES */

    for(let i = 0; i < 20; i++) {

        const petalo =
            document.createElement("div");

        petalo.className =
            "petalo interior";

        petalo.style.transform =
            `translate(-50%, -100%)
             rotate(${i * 18 + 9}deg)`;

        flor.appendChild(petalo);

    }


    /* CENTRO */

    const centro =
        document.createElement("div");

    centro.className =
        "centro";

    flor.appendChild(centro);

});


/* =====================================================
   NIEVE DORADA
===================================================== */

for(let i = 0; i < 75; i++) {

    const particula =
        document.createElement("div");

    particula.className =
        "particula";


    particula.style.left =
        Math.random() * 100 + "vw";


    particula.style.top =
        Math.random() * 100 + "vh";


    particula.style.setProperty(
        "--delay",
        (10 + Math.random() * 8) + "s"
    );


    particula.style.setProperty(
        "--duration",
        (4 + Math.random() * 5) + "s"
    );


    /*
       Algunas partículas serán
       un poco más pequeñas.
    */

    const tamano =
        2.5 + Math.random() * 4;


    particula.style.width =
        tamano + "px";

    particula.style.height =
        tamano + "px";


    document.body.appendChild(
        particula
    );

}


</script>
